# ProofOfPen — local dev stack (Apache + PHP 8 + MySQL 8), closest mirror
# of Hostinger shared hosting. Run from this dev/ directory:
#   docker compose up -d --build
#   docker compose exec mysql mysql ... < migration (see dev/README.md)
# App: http://localhost:8080
services:
  web:
    build:
      context: ..
      dockerfile: dev/Dockerfile
    ports:
      - "18080:80"
    volumes:
      - ..:/var/www/html
    environment:
      POP_DEV: "0"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: pop_root
      MYSQL_DATABASE: proofofpen
      MYSQL_USER: pop
      MYSQL_PASSWORD: pop
    ports:
      - "23306:3306"
    volumes:
      - pop_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppop_root"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pop_mysql:
